<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Grnessrinbot</title>

<style>
body{
  margin:0;
  font-family:'Amiri',serif;
  background:#0b0f1a;
  color:white;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:20px;
  padding:40px;
}

.card{
  background:#111827;
  padding:25px;
  border-radius:15px;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  box-shadow:0 0 35px rgba(212,175,55,0.35);
  transform:translateY(-4px);
}

.icon{
  font-size:35px;
  margin-bottom:10px;
}

.footer{
  margin-top:40px;
  padding:20px;
  border-top:1px solid #333;
  color:#aaa;
}
</style>
</head>

<body>

<h1>🌙 Grnessrinbot</h1>

<div class="grid">

  <div class="card" onclick="window.open('https://sunnah.com/bukhari','_blank')">
    <div class="icon">📖</div>
    <div>صحيح البخاري</div>
  </div>

  <div class="card" onclick="window.open('https://sunnah.com/muslim','_blank')">
    <div class="icon">📚</div>
    <div>صحيح مسلم</div>
  </div>

  <div class="card" onclick="window.open('https://waqfeya.net/category.php?cid=23','_blank')">
    <div class="icon">📘</div>
    <div>كتب السلف</div>
  </div>

  <div class="card" onclick="window.open('https://sunnah.com/hisn','_blank')">
    <div class="icon">🤲</div>
    <div>الأدعية المأثورة</div>
  </div>

</div>

<div class="footer">
وقف نسرين — صدقة جارية عنها وعن والديها وأهلها وأحبتها
</div>

</body>
</html>
