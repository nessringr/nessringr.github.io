<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدقة جارية لنسرين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:linear-gradient(180deg,#000,#111);
color:#f5e6c8;
}

header{
text-align:center;
padding:30px;
font-size:28px;
color:#d4af37;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#0f0f0f;
border-radius:20px;
padding:25px;
margin:20px 0;
box-shadow:0 0 30px rgba(212,175,55,0.15);
}

h2{
color:#d4af37;
}

select{
width:100%;
padding:10px;
border-radius:10px;
margin-top:10px;
font-size:16px;
}

audio{
width:100%;
margin-top:15px;
}

.footer{
text-align:center;
padding:30px;
color:#aaa;
}
</style>

<script>
function playSurah(){
let surah=document.getElementById("surah").value;
let player=document.getElementById("player");
player.src="https://server8.mp3quran.net/minsh/"+surah+".mp3";
player.play();
}
</script>
</head>

<body>

<header>
صدقة جارية لنسرين ووالديها وأهلها وأحبتها 🤍
</header>

<div class="container">

<div class="card">
<h2>التلاوات الكاملة - المنشاوي</h2>

اختر السورة:

<select id="surah" onchange="playSurah()">
<option value="">-- اختر سورة --</option>
<option value="001">الفاتحة</option>
<option value="002">البقرة</option>
<option value="003">آل عمران</option>
<option value="004">النساء</option>
<option value="005">المائدة</option>
<option value="036">يس</option>
<option value="055">الرحمن</option>
<option value="067">الملك</option>
<option value="078">النبأ</option>
<option value="112">الإخلاص</option>
<option value="113">الفلق</option>
<option value="114">الناس</option>
</select>

<audio id="player" controls></audio>

</div>

</div>

<div class="footer">
اللهم اجعل هذا العمل نوراً في قبر نسرين ووالديها 🤍
</div>

</body>
</html>
